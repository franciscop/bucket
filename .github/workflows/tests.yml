name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, mocked suites, signer oracles, and FileSystem, plus B2 live when the
  # Backblaze secrets are set. The bundle is built via the `prepare` hook during
  # `bun install`, so a build failure fails this job too. No Docker required.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies (also builds via prepare)
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test --timeout 30000
        env:
          CI: true
          B2_BUCKET: ${{ secrets.BACKBLAZE_NAME }}
          B2_APPLICATION_KEY_ID: ${{ secrets.BACKBLAZE_ID }}
          B2_APPLICATION_KEY: ${{ secrets.BACKBLAZE_KEY }}

  # Full integration suite for S3, R2, GCS and Azure against local emulators.
  # No cloud credentials and no Docker; MinIO and Azurite verify request
  # signatures. Emulators run as native binaries, orchestrated by
  # test/emulators.ts (Azurite ships as a devDependency via `bun install`).
  emulators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Install MinIO and fake-gcs-server
        run: |
          sudo curl -sSL https://dl.min.io/server/minio/release/linux-amd64/minio -o /usr/local/bin/minio
          sudo chmod +x /usr/local/bin/minio
          curl -sSL https://github.com/fsouza/fake-gcs-server/releases/download/v1.52.2/fake-gcs-server_1.52.2_Linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin fake-gcs-server
      - name: Run integration suite against emulators
        run: bun run test:emulators
