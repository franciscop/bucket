name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, mocked suites, signer oracles, and FileSystem, plus B2 live when the
  # Backblaze secrets are set. The bundle is built via the `prepare` hook during
  # `bun install`, so a build failure fails this job too. No Docker required.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies (also builds via prepare)
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test --timeout 30000
        env:
          CI: true
          B2_BUCKET: ${{ secrets.BACKBLAZE_NAME }}
          B2_APPLICATION_KEY_ID: ${{ secrets.BACKBLAZE_ID }}
          B2_APPLICATION_KEY: ${{ secrets.BACKBLAZE_KEY }}

  # Full integration suite for S3, R2, GCS and Azure against local emulators.
  # No cloud credentials; SILO (MinIO fork) and Azurite verify request
  # signatures. The emulators run as native binaries, orchestrated by
  # test/emulators.ts (Azurite ships as a devDependency via `bun install`).
  emulators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Install SILO and fake-gcs-server
        run: |
          set -euo pipefail
          # SILO is the maintained fork of the archived MinIO server
          curl -fsSL https://github.com/pgsty/silo/releases/download/RELEASE.2026-10-18T00-00-00Z/silo_20261018000000.0.0_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin silo
          curl -fsSL https://github.com/fsouza/fake-gcs-server/releases/download/v1.56.1/fake-gcs-server_1.56.1_Linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin fake-gcs-server
          # Fail here rather than with a confusing ENOEXEC once the suite runs
          silo --version
      - name: Run integration suite against emulators
        run: bun run test:emulators
