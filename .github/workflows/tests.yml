name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, mocked suites, signer oracles, and FileSystem, plus B2 live when the
  # Backblaze secrets are set. The bundle is built via the `prepare` hook during
  # `bun install`, so a build failure fails this job too. No Docker required.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies (also builds via prepare)
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test --timeout 30000
        env:
          CI: true
          B2_BUCKET: ${{ secrets.BACKBLAZE_NAME }}
          B2_APPLICATION_KEY_ID: ${{ secrets.BACKBLAZE_ID }}
          B2_APPLICATION_KEY: ${{ secrets.BACKBLAZE_KEY }}

  # Full integration suite for S3, R2, GCS and Azure against local emulators.
  # No cloud credentials; MinIO and Azurite verify request signatures. The
  # emulators run as native binaries, orchestrated by test/emulators.ts
  # (Azurite ships as a devDependency via `bun install`).
  emulators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Install MinIO and fake-gcs-server
        env:
          # MinIO archived its open-source server and dl.min.io now answers 410
          # for every binary, so take it out of the last published image. It
          # still runs as a native process; only fetching it involves Docker.
          MINIO_IMAGE: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
        run: |
          set -euo pipefail
          docker create --name minio-bin "$MINIO_IMAGE" >/dev/null
          docker cp minio-bin:/usr/bin/minio /tmp/minio
          docker rm minio-bin >/dev/null
          sudo install -m 0755 /tmp/minio /usr/local/bin/minio
          curl -fsSL https://github.com/fsouza/fake-gcs-server/releases/download/v1.52.2/fake-gcs-server_1.52.2_Linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin fake-gcs-server
          # Fail here rather than with a confusing ENOEXEC once the suite runs
          minio --version
      - name: Run integration suite against emulators
        run: bun run test:emulators
